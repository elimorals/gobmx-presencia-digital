name: probe-cnartys

# TEMPORAL: prueba si el runner (IP de datacenter) puede bajar el CSV del catálogo nacional. Sin commit.
on:
  push:
    branches: [feat/cnartys-tramites]
    paths: [.github/workflows/probe-cnartys.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I scripts/cnartys.py sondear --dias 4
      - run: python3 -I scripts/cnartys.py actualizar --dias 7
      - run: python3 -I scripts/test_orden_poder.py
      - run: git diff --stat
